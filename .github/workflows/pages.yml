name: Pages demo
on:
  push:
    tags: ['v*']          # the demo tracks releases, not every commit
  workflow_dispatch: {}   # ...and can be refreshed by hand any time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build demo site
        run: python3 skills/mainstem/scripts/build_demo_site.py _site

      - name: Screenshots for the README (both color schemes)
        run: |
          npx --yes playwright@1.49.1 install --with-deps chromium
          npx --yes playwright@1.49.1 screenshot --viewport-size=1680,950 --color-scheme=dark \
            --wait-for-timeout=2500 "file://$PWD/_site/index.html" _site/screenshot-dark.png
          npx --yes playwright@1.49.1 screenshot --viewport-size=1680,950 --color-scheme=light \
            --wait-for-timeout=2500 "file://$PWD/_site/index.html" _site/screenshot-light.png
          cp _site/screenshot-dark.png _site/screenshot.png

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

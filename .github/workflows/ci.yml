name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs the pushed range; a shallow checkout lacks the parent commit
          # and the resulting git stderr fails the whole scan
          fetch-depth: 0

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Python syntax
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile

      - name: Python unit tests
        run: |
          set -e
          export MS_CONFIG=/tmp/ms-ci-test-config.json
          echo '{"dataDir": "/tmp/ms-ci-test-data", "reviewsDir": "/tmp/ms-ci-test-reviews"}' > "$MS_CONFIG"
          mkdir -p /tmp/ms-ci-test-data /tmp/ms-ci-test-reviews/active
          cd skills/mainstem/scripts
          for t in test_config.py test_session_status_from_notes.py test_reviews_index.py test_backfill_excerpts.py; do
            echo "== $t =="
            python3 "$t"
          done

      - name: Extract and check inline page script
        run: |
          python3 - <<'EOF'
          import re
          src = open("skills/mainstem/scripts/template.html").read()
          m = re.search(r"<script>(.*)</script>", src, re.S)
          open("/tmp/ms_template_script.js", "w").write(m.group(1))
          EOF
          node --check /tmp/ms_template_script.js

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Blocklist hygiene grep
        run: |
          set -e
          # Generic hygiene only — the real named blocklist never enters the repo (spec § Privacy).
          # __pycache__/*.pyc is excluded everywhere here: a fresh Python import (e.g. the
          # "Python unit tests" step above) bakes an *absolute* co_filename into the .pyc it
          # generates, so on a real runner that binary file can spuriously match the absolute-path
          # grep depending on the exact runner path shape — that's a build artifact, not a leak.
          if grep -rnE '/Users/[a-zA-Z0-9_.-]+|/home/[a-zA-Z0-9_.-]+' \
               --include='*' --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "found an absolute home path — see matches above"; exit 1
          fi
          if grep -rnE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
               --include='*' --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "found an email address — see matches above"; exit 1
          fi
          if grep -rnE '[A-Za-z0-9-]+\.atlassian\.net' --include='*' --exclude-dir=.git --exclude-dir=__pycache__ . \
               | grep -vE 'yourteam\.atlassian\.net|yourcompany\.atlassian\.net'; then
            echo "found an atlassian.net host — see matches above"; exit 1
          fi
          echo "hygiene grep clean"

      - name: Smoke test (demo mode)
        run: |
          export MS_CONFIG=/tmp/ms-ci-config.json
          echo '{"dataDir": "/tmp/ms-ci-data"}' > "$MS_CONFIG"
          python3 skills/mainstem/scripts/ms_server.py --demo &
          SERVER_PID=$!
          sleep 2
          HEALTH=$(curl -sf http://127.0.0.1:7777/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ok": true'
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7777/)
          test "$CODE" = "200"
          kill $SERVER_PID
